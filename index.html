<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
<title>Painel Pé de Serra</title>
<style>
:root {
  --blue: #0940FA; --green: #6DE223; --amber: #F29F05; --gray: #8a93a6;
  --bg: #f4f6fa; --panel: #ffffff; --fg: #141821; --muted: #5d6476; --line: #e1e5ee; --track: #eceff5;
  --bad: #c42b2b; --warn: #b46a00; --pop: #ffffff; --shadow: 0 6px 24px rgba(20, 24, 33, .12);
  --radius: 12px; --serif: ui-serif, "New York", Georgia, "Times New Roman", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --blue: #5a7dff; --bg: #0e1118; --panel: #161a24; --fg: #eef0f6; --muted: #9ba3b6; --line: #262c3b; --track: #222838;
    --bad: #ff6b6b; --warn: #f0b04a; --pop: #1d2230; --shadow: 0 6px 24px rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --blue: #5a7dff; --bg: #0e1118; --panel: #161a24; --fg: #eef0f6; --muted: #9ba3b6; --line: #262c3b; --track: #222838;
  --bad: #ff6b6b; --warn: #f0b04a; --pop: #1d2230; --shadow: 0 6px 24px rgba(0, 0, 0, .5); color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--sans); font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }
.wrap-page { max-width: 1180px; margin: 0 auto; padding: 24px 16px 40px; display: flex; flex-direction: column; gap: 20px; }

/* Cabeçalho */
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; border-bottom: 3px solid var(--green); padding-bottom: 14px; }
.head h1 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: clamp(1.6rem, 4vw, 2.2rem); line-height: 1.15; }
.head .sub { margin: 4px 0 0; color: var(--muted); }
.head .acts { display: flex; gap: 8px; flex-wrap: wrap; }

/* Controles */
select, input, button { font: inherit; color: var(--fg); }
select, input[type=password], input[type=search], input[type=date] { width: 100%; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.btn { padding: 8px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); cursor: pointer; white-space: nowrap; }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
.btn:disabled { opacity: .6; cursor: progress; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.filters { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 11rem), 1fr)); gap: 10px 14px; align-items: end; }
.f { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.f label, label { font-size: .8rem; color: var(--muted); }

/* Abas */
.tabs { display: flex; gap: 2px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tab { all: unset; cursor: pointer; padding: 10px 14px; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tab[aria-selected=true] { color: var(--fg); border-bottom-color: var(--blue); font-weight: 600; }
.tab:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
.panel { display: flex; flex-direction: column; gap: 16px; }

/* Indicadores */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr)); gap: 12px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--blue); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi.g { border-top-color: var(--green); }
.kpi.a { border-top-color: var(--amber); }
.kpi .lbl { font-size: .8rem; color: var(--muted); }
.kpi .val { font-family: var(--serif); font-size: 1.55rem; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .hint { font-size: .8rem; color: var(--muted); }
.meter { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; margin-top: 6px; }
.meter i { display: block; height: 100%; background: var(--blue); border-radius: 4px; }

/* Cartões e grade */
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 24rem), 1fr)); gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.wide { grid-column: 1 / -1; }
.card h2 { margin: 0; font-size: 1.02rem; font-weight: 600; }
.note { margin: 0; color: var(--muted); font-size: .8rem; }
.empty { display: flex; align-items: center; justify-content: center; min-height: 80px; color: var(--muted); font-size: .85rem; }

/* Gráficos */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.tick { fill: var(--muted); font-size: 11px; }
.grid-line { stroke: var(--line); }
.tip { position: absolute; pointer-events: none; background: var(--pop); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 6px 10px; font-size: .8rem; white-space: nowrap; z-index: 3; }
.tip .d { color: var(--muted); }
.tip .r { display: flex; gap: 12px; justify-content: space-between; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.bars { display: flex; flex-direction: column; gap: 10px; }
.brow { display: grid; grid-template-columns: minmax(0, 13rem) minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.brow .name { overflow-wrap: anywhere; font-size: .9rem; }
.brow .track { height: 14px; background: var(--track); border-radius: 7px; overflow: hidden; }
.brow .track i { display: block; height: 100%; border-radius: 7px; background: var(--blue); }
.bars.g .track i { background: var(--green); }
.brow .num { text-align: right; white-space: nowrap; font-size: .9rem; }
.brow .num small { color: var(--muted); margin-left: 6px; }
@media (max-width: 560px) { .brow { grid-template-columns: minmax(0, 1fr) auto; } .brow .track { grid-column: 1 / -1; order: 3; } }

/* Tabelas */
.tablewrap { overflow-x: auto; }
.scroll { max-height: 30rem; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th { position: sticky; top: 0; background: var(--panel); color: var(--muted); font-weight: 600; font-size: .78rem; white-space: nowrap; z-index: 1; }
td.n, th.n { text-align: right; white-space: nowrap; }
tfoot td { font-weight: 600; border-bottom: none; }
.tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
.tools > .f { flex: 1 1 14rem; }

/* Romaneio */
details.day { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
details.day + details.day { margin-top: 8px; }
details.day > summary { cursor: pointer; padding: 10px 14px; background: var(--blue); color: #fff; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; list-style: none; }
details.day > summary::-webkit-details-marker { display: none; }
details.day > summary::before { content: "▸"; margin-right: 8px; }
details.day[open] > summary::before { content: "▾"; }
details.day > summary span:first-child { flex: 1; }
.nota { padding: 9px 14px; border-top: 1px solid var(--line); }
.nota .h { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; font-size: .9rem; }
.nota .h small { font-weight: 400; color: var(--muted); }
.nota .it { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: .82rem; padding-left: 14px; }

/* Login */
.login { max-width: 420px; width: 100%; margin: 6vh auto 0; }
.login form { display: flex; flex-direction: column; gap: 12px; }
.err { color: var(--bad); min-height: 1.3em; font-size: .88rem; margin: 0; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand b { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; background: var(--blue); color: #fff; font-family: var(--serif); font-size: 1.05rem; }

@media print {
  body { background: #fff; color: #000; }
  .noprint, .filters, .tabs, .head .acts { display: none !important; }
  .panel.hidden.print-keep { display: flex !important; }
  .card, .kpi { border-color: #ccc; break-inside: avoid; }
  details.day { break-inside: avoid; }
  details.day > summary { background: #0940FA !important; color: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>
<div class="wrap-page">
  <header class="head" id="topo">
    <div>
      <h1 id="titulo">Painel de vendas</h1>
      <p class="sub" id="sub">Pé de Serra Irrigação</p>
    </div>
    <div class="acts hidden" id="acts">
      <button class="btn" type="button" id="imprimir">Imprimir / PDF</button>
      <button class="btn" type="button" id="sair">Sair</button>
    </div>
  </header>

  <section class="card login" id="login">
    <div class="brand"><b>P</b><h2>Entrar no painel</h2></div>
    <form id="form" autocomplete="off">
      <div class="f"><label for="usr">Quem é você</label><select id="usr"></select></div>
      <div class="f"><label for="pw">Senha</label><input id="pw" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required></div>
      <button class="btn primary" type="submit" id="go">Entrar</button>
      <p class="err" id="err" role="alert"></p>
      <p class="note">Os dados ficam criptografados. A senha abre só o que é seu. Se a senha estiver errada, nada é mostrado.</p>
      <p class="note">Esqueceu a senha ou quer trocar? Fale com a gestão: a nova senha passa a valer na próxima atualização do painel.</p>
    </form>
  </section>

  <div id="app" class="panel hidden"></div>
</div>
<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const brl = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
  const brl0 = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
  const kfmt = (v) => v >= 1000 ? 'R$ ' + (v / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mil' : brl0.format(v);
  const pct = (v) => (v * 100).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%';
  const int = (v) => v.toLocaleString('pt-BR');
  const mk = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  const NS = 'http://www.w3.org/2000/svg';
  const sv = (tag, at) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); return e; };
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const sum = (a, f) => a.reduce((t, x) => t + f(x), 0);
  const CORES = ['var(--blue)', 'var(--green)', 'var(--amber)', 'var(--gray)'];
  const dataBR = (iso) => iso.split('-').reverse().join('/');

  const decrypt = async (blob, pw) => {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw.trim().toLowerCase()), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(blob.salt), iterations: blob.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(blob.iv) }, key, b64(blob.ct));
    return JSON.parse(new TextDecoder().decode(buf));
  };

  // ---------- peças ----------
  const kpi = (lbl, val, hint, cls, meter) => {
    const k = mk('div', 'kpi' + (cls ? ' ' + cls : '')); k.append(mk('div', 'lbl', lbl), mk('div', 'val', val));
    if (hint) k.append(mk('div', 'hint', hint));
    if (meter != null) { const m = mk('div', 'meter'); const i = mk('i'); i.style.width = Math.min(100, meter * 100) + '%'; m.append(i); k.append(m); }
    return k;
  };
  const card = (id, titulo, cls) => { const c = mk('section', 'card' + (cls ? ' ' + cls : '')); c.id = id; c.append(mk('h2', '', titulo)); return c; };
  const barras = (lista, cls) => {
    const w = mk('div', 'bars' + (cls ? ' ' + cls : '')); const mx = Math.max(1, ...lista.map((x) => x.v));
    if (!lista.length) { w.append(mk('div', 'empty', 'Sem dados no período.')); return w; }
    lista.forEach((x) => {
      const r = mk('div', 'brow'); const t = mk('div', 'track'); const i = mk('i'); i.style.width = (x.v / mx * 100) + '%'; t.append(i);
      const n = mk('div', 'num', x.txt); if (x.sub) n.append(mk('small', '', x.sub)); r.append(mk('div', 'name', x.nome), t, n); w.append(r);
    });
    return w;
  };
  const tabela = (cols, linhas, foot) => {
    const w = mk('div', 'tablewrap'); const t = mk('table'); const th = mk('thead'); const tr = mk('tr');
    cols.forEach(([c, n]) => tr.append(mk('th', n ? 'n' : '', c))); th.append(tr); t.append(th);
    const tb = mk('tbody'); linhas.forEach((l) => { const r = mk('tr'); l.forEach((x, i) => r.append(mk('td', cols[i][1] ? 'n' : '', x))); tb.append(r); }); t.append(tb);
    if (foot) { const tf = mk('tfoot'); const r = mk('tr'); foot.forEach((x, i) => r.append(mk('td', cols[i][1] ? 'n' : '', x))); tf.append(r); t.append(tf); }
    w.append(t); return w;
  };

  // Gráfico de colunas por dia (empilhado por série). dias: [{label, full, partes:[{s, v}]}]
  const charts = [];
  const colunas = (host, dias, series) => {
    const draw = () => {
      host.replaceChildren();
      if (!dias.length) { host.append(mk('div', 'empty', 'Sem vendas no período.')); return; }
      const W = Math.max(280, host.clientWidth || 600), H = 240, m = { t: 12, r: 8, b: 26, l: 52 };
      const iw = W - m.l - m.r, ih = H - m.t - m.b;
      const tot = dias.map((d) => sum(d.partes, (p) => p.v)); const mx = Math.max(1, ...tot);
      const step = niceStep(mx / 4); const top = Math.ceil(mx / step) * step;
      const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Faturamento por dia' });
      for (let v = 0; v <= top + 1e-6; v += step) {
        const y = m.t + ih - (v / top) * ih;
        svg.append(sv('line', { x1: m.l, x2: W - m.r, y1: y, y2: y, class: 'grid-line' }));
        const tx = sv('text', { x: m.l - 6, y: y + 4, 'text-anchor': 'end', class: 'tick' }); tx.textContent = kfmt(v); svg.append(tx);
      }
      const bw = iw / dias.length, gap = Math.min(6, bw * 0.25), every = Math.ceil(dias.length / Math.max(1, Math.floor(iw / 28)));
      dias.forEach((d, i) => {
        let y = m.t + ih; const x = m.l + i * bw + gap / 2; const g = sv('g', {});
        d.partes.forEach((p) => {
          const h = (p.v / top) * ih; y -= h;
          g.append(sv('rect', { x, y, width: Math.max(1, bw - gap), height: Math.max(0, h), fill: CORES[series.indexOf(p.s) % CORES.length], rx: 2 }));
        });
        const hit = sv('rect', { x: m.l + i * bw, y: m.t, width: bw, height: ih, fill: 'transparent' });
        const show = (ev) => {
          tip.replaceChildren(mk('div', 'd', d.full));
          const ln = mk('div', 'r'); ln.append(mk('b', '', 'Total'), mk('b', '', brl.format(tot[i]))); tip.append(ln);
          if (d.partes.length > 1) d.partes.forEach((p) => { const r = mk('div', 'r'); r.append(mk('span', '', p.s), mk('span', '', brl.format(p.v))); tip.append(r); });
          tip.classList.remove('hidden');
          const bx = host.getBoundingClientRect(); const px = (ev.clientX ?? (bx.left + (m.l + (i + .5) * bw) * bx.width / W)) - bx.left;
          const tw = tip.offsetWidth; tip.style.left = Math.max(0, Math.min(bx.width - tw, px - tw / 2)) + 'px'; tip.style.top = '-8px';
        };
        hit.addEventListener('pointermove', show); hit.addEventListener('pointerdown', show); hit.addEventListener('pointerleave', () => tip.classList.add('hidden'));
        g.append(hit); svg.append(g);
        if (i % every === 0) { const tx = sv('text', { x: m.l + (i + .5) * bw, y: H - 8, 'text-anchor': 'middle', class: 'tick' }); tx.textContent = d.label; svg.append(tx); }
      });
      const tip = mk('div', 'tip hidden'); host.append(svg, tip);
    };
    charts.push(draw); draw();
  };
  const niceStep = (x) => { const p = Math.pow(10, Math.floor(Math.log10(Math.max(x, 1)))); const n = x / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; };
  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => charts.forEach((f) => f()), 150); });
  const legenda = (series) => { const l = mk('div', 'legend'); series.forEach((s, i) => { const x = mk('span'); const c = mk('i'); c.style.background = CORES[i % CORES.length]; x.append(c, document.createTextNode(s)); l.append(x); }); return l; };

  const romaneio = (host, dias, admin) => {
    host.replaceChildren();
    if (!dias.length) { host.append(mk('div', 'empty', 'Sem vendas neste mês.')); return; }
    dias.forEach((d) => {
      const det = mk('details', 'day'); const sm = mk('summary');
      sm.append(mk('span', '', d.d + ' · ' + d.n.length + (d.n.length === 1 ? ' lançamento' : ' lançamentos')), mk('span', '', brl.format(d.total))); det.append(sm);
      d.n.forEach((n) => {
        const bx = mk('div', 'nota'); const h = mk('div', 'h'); const t = mk('span', '', n.t);
        const extra = [admin && n.cl, admin && n.f].filter(Boolean).join(' · '); if (extra) t.append(mk('small', '', ' · ' + extra));
        h.append(t, mk('span', '', brl.format(n.v))); bx.append(h);
        n.i.forEach((i) => { const r = mk('div', 'it'); r.append(mk('span', '', i.t), mk('span', '', brl.format(i.v))); bx.append(r); });
        det.append(bx);
      });
      host.append(det);
    });
  };
  const ctrlRomaneio = (host) => {
    const t = mk('div', 'tools noprint');
    const ab = mk('button', 'btn', 'Abrir todos'); ab.type = 'button'; ab.addEventListener('click', () => host.querySelectorAll('details').forEach((d) => (d.open = true)));
    const fe = mk('button', 'btn', 'Fechar todos'); fe.type = 'button'; fe.addEventListener('click', () => host.querySelectorAll('details').forEach((d) => (d.open = false)));
    t.append(ab, fe); return t;
  };
  const diaCurto = (d) => d.d.split(' ')[1].slice(0, 2);

  // ---------- filtros: apoio ----------
  const tipoDe = (t) => (t.startsWith('Caderno') ? 'Caderno' : t.split(' ')[0]);
  const isoDe = (dd) => dd.iso || dd.d.split(' ')[1].split('/').reverse().join('-');
  const campo = (id, rot, el) => { const f = mk('div', 'f'); const l = mk('label', '', rot); l.htmlFor = id; el.id = id; f.append(l, el); return f; };
  const selOpts = (el, ops, todos) => { const v = el.value; el.replaceChildren(new Option(todos, '')); ops.forEach((o) => el.append(new Option(o, o))); el.value = ops.includes(v) ? v : ''; };
  const dateIn = () => { const i = mk('input'); i.type = 'date'; return i; };
  const fimMes = (mes) => { const [y, m] = mes.split('-').map(Number); return mes + '-' + String(new Date(y, m, 0).getDate()).padStart(2, '0'); };
  const naData = (iso, de, ate) => (!de || iso >= de) && (!ate || iso <= ate);
  const periodo = (de, ate) => (de && ate ? (de === ate ? ' · dia ' + dataBR(de) : ' · ' + dataBR(de) + ' a ' + dataBR(ate)) : de ? ' · a partir de ' + dataBR(de) : ate ? ' · até ' + dataBR(ate) : '');
  const botaoLimpar = () => { const b = mk('button', 'btn', 'Limpar filtros'); b.type = 'button'; const f = mk('div', 'f'); f.append(mk('label', '', ' '), b); return { f, b }; };
  const porDia = (ns) => {
    const m = new Map();
    ns.forEach((n) => { const e = m.get(n.iso) || { iso: n.iso, d: n.dl, total: 0, n: [] }; e.total += n.v; e.n.push(n); m.set(n.iso, e); });
    return [...m.values()].sort((a, b) => (a.iso < b.iso ? -1 : 1));
  };
  // agrega itens [{m, q, v, c?, s}] em mercadorias e seções; item sem m = sem detalhe
  const agregar = (itens) => {
    const mc = new Map(), sc = new Map();
    itens.forEach((it) => {
      const s = it.m ? it.s || 'Sem seção' : 'Sem detalhe';
      const y = sc.get(s) || { s, v: 0, mg: 0, vc: 0 }; y.v += it.v; if (it.c != null) { y.mg += it.v - it.c; y.vc += it.v; } sc.set(s, y);
      if (!it.m) return;
      const x = mc.get(it.m) || { m: it.m, q: 0, v: 0, mg: 0, sem: false };
      x.q += it.q || 0; x.v += it.v; if (it.c != null) x.mg += it.v - it.c; else x.sem = true; mc.set(it.m, x);
    });
    return {

        bloco('alerta-suspeito', 'Custo suspeito no cadastro', 'O custo unitário é mais de 3 vezes o preço de venda: provavelmente o custo da caixa ou do pacote foi cadastrado na unidade. Corrija o custo no MIX. Esses itens ficam fora da margem até lá.', A.suspeito, tabela(colsIt, linhasIt(A.suspeito))),
        bloco('alerta-abaixo', 'Vendidos abaixo do custo', 'Preço de venda menor que o custo cadastrado. Confira o preço de tabela ou se houve desconto indevido.', A.abaixo, tabela(colsIt, linhasIt(A.abaixo))),
        bloco('alerta-semdetalhe', 'Notas com itens não listados', 'O total da nota é maior que a soma dos itens que os relatórios do MIX trazem. O valor conta no faturamento, mas fica fora das mercadorias e da margem.', A.semDetalhe,
          tabela([['Data'], ['Nota'], ['Vendedor'], ['Total da nota', 1], ['Sem detalhe', 1]], A.semDetalhe.map((x) => [dataBR(x.d), x.t, x.vend, brl.format(x.total), brl.format(x.falta)]))),
        mk('p', 'note', 'Cliente: os relatórios do MIX não trazem o cliente da nota. Para analisar clientes, é preciso preencher clientes.csv ou exportar os XMLs das notas.'));
    };
    sMes.addEventListener('change', () => { prepMes(); draw(); });
    [sDe, sAte, sVend, sForma, sTipo, sSec].forEach((e) => e.addEventListener('change', draw));
    lp.b.addEventListener('click', () => { [sDe, sAte, sVend, sForma, sTipo, sSec].forEach((e) => (e.value = '')); draw(); });
    prepMes(); draw();
  };

  // ---------- entrada ----------
  fetch('data/usuarios.json').then((r) => r.json()).then((us) => { us.forEach((u) => $('#usr').append(new Option(u.nome, u.id))); });
  $('#form').addEventListener('submit', async (e) => {
    e.preventDefault(); const err = $('#err'); err.textContent = ''; const go = $('#go'); go.disabled = true; go.textContent = 'Abrindo…';
    try {
      const id = $('#usr').value; const blob = await (await fetch('data/' + id + '.json', { cache: 'no-store' })).json();
      const P = await decrypt(blob, $('#pw').value);
      $('#pw').value = ''; $('#login').classList.add('hidden'); $('#app').classList.remove('hidden'); $('#acts').classList.remove('hidden');
      (P.perfil === 'admin' ? viewAdmin : viewVendedor)(P);
    } catch (x) { err.textContent = 'Senha incorreta ou dados indisponíveis.'; console.error(x); }
    go.disabled = false; go.textContent = 'Entrar';
  });
  $('#sair').addEventListener('click', () => location.reload());
  $('#imprimir').addEventListener('click', () => window.print());
})();
</script>
</body>
</html>
